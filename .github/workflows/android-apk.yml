name: Build Baloot Bahmad APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Ensure Android platform files and app identity
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name=baloot_bahmad --org=com.bahmad .
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.bahmad.baloot"/g' android/app/build.gradle.kts
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/applicationId "[^"]*"/applicationId "com.bahmad.baloot"/g' android/app/build.gradle
          fi
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:label="[^"]*"/android:label="بلوت بحمد"/g' android/app/src/main/AndroidManifest.xml
          fi

      - name: Configure optional Firebase google-services.json from secret
        if: env.FIREBASE_GOOGLE_SERVICES_JSON != ''
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: baloot-bahmad-apk
          path: build/app/outputs/flutter-apk/app-release.apk
